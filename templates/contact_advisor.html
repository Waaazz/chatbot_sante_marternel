{% extends 'base.html' %}
{% block title %}Contacter un conseiller{% endblock %}

{% block body %}
{% include '_topbar.html' %}
<main class="page">
    <div class="page-narrow">
        <div class="panel">
            <div class="panel-head">
                <div class="panel-icon accent"><i class="fas fa-user-doctor"></i></div>
                <h1>Contacter un conseiller</h1>
                <p>Un professionnel de santé vous répondra rapidement</p>
            </div>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Votre nom</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Entrez votre nom" autocomplete="name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" id="email" name="email" placeholder="votre@email.com" autocomplete="email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone_number">Numéro de téléphone</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="+226..." autocomplete="tel" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Votre message</label>
                    <div class="input-icon">
                        <i class="fas fa-comment-medical"></i>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Décrivez votre situation ou posez votre question..." required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-accent btn-block-brand mt-2">
                    <i class="fas fa-paper-plane"></i>Envoyer le message
                </button>
            </form>

            <div id="responseMessage" class="msg-box" role="status"></div>
        </div>

        <div class="page-links">
            <a href="/ask"><i class="fas fa-arrow-left mr-1"></i>Retour au chatbot</a>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('contactForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const responseDiv = document.getElementById('responseMessage');

        const phone_number = document.getElementById('phone_number').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;

        if (!phone_number || !name || !email || !message) {
            responseDiv.textContent = 'Veuillez remplir tous les champs.';
            responseDiv.className = 'msg-box error';
            return;
        }

        try {
            const response = await fetch('/contact_advisor', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone_number, name, email, message })
            });

            const result = await response.json();
            responseDiv.textContent = result.message || result.error;
            responseDiv.className = 'msg-box ' + (response.ok ? 'success' : 'error');
            if (response.ok) this.reset();
        } catch (error) {
            responseDiv.textContent = 'Une erreur est survenue. Veuillez réessayer.';
            responseDiv.className = 'msg-box error';
        }
    });
</script>
{% endblock %}
