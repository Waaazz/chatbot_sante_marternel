{% extends 'base.html' %}
{% block title %}Ajouter un rappel{% endblock %}

{% block body %}
{% include '_topbar.html' %}
<main class="page">
    <div class="page-narrow">
        <div class="panel">
            <div class="panel-head">
                <div class="panel-icon"><i class="fas fa-bell"></i></div>
                <h1>Ajouter un rappel</h1>
                <p>Programmez un rappel SMS pour vos rendez-vous</p>
            </div>

            <form id="reminderForm">
                <div class="form-group">
                    <label for="phone_number">Numéro de téléphone</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="+226..." autocomplete="tel" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reminder_type">Type de rappel</label>
                    <div class="input-icon">
                        <i class="fas fa-stethoscope"></i>
                        <select class="form-control" id="reminder_type" name="reminder_type" required>
                            <option value="prénatale">Visite prénatale</option>
                            <option value="postnatale">Visite postnatale</option>
                            <option value="vaccination">Vaccination</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reminder_date">Date du rappel</label>
                    <div class="input-icon">
                        <i class="fas fa-calendar-days"></i>
                        <input type="date" class="form-control" id="reminder_date" name="reminder_date" required>
                    </div>
                </div>
                <button type="submit" class="btn-brand btn-block-brand mt-2">
                    <i class="fas fa-circle-plus"></i>Ajouter le rappel
                </button>
            </form>

            <div id="message" class="msg-box" role="status"></div>
        </div>

        <div class="page-links">
            <a href="/ask"><i class="fas fa-arrow-left mr-1"></i>Retour au chatbot</a>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('reminderForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const phone_number = document.getElementById('phone_number').value;
        const reminder_type = document.getElementById('reminder_type').value;
        const reminder_date = document.getElementById('reminder_date').value;
        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('/set_reminder', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone: phone_number,
                    type: reminder_type,
                    date: reminder_date,
                    name: 'Utilisateur',
                    time: '08:00'
                })
            });

            const result = await response.json();
            messageDiv.textContent = result.message;
            messageDiv.className = 'msg-box ' + (response.ok ? 'success' : 'error');
            if (response.ok) this.reset();
        } catch (error) {
            messageDiv.textContent = 'Une erreur est survenue. Veuillez réessayer.';
            messageDiv.className = 'msg-box error';
        }
    });
</script>
{% endblock %}
