<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}Accueil{% endblock %} · MamaBot BF</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="manifest" href="{{ url_for('web_manifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MamaBot BF">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}

<button type="button" id="pwa-install" class="btn-brand pwa-install" hidden>
    <i class="fas fa-download"></i>Installer l'application
</button>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('{{ url_for("service_worker") }}', { scope: '/' })
                .catch(function (err) { console.warn('Service worker non enregistré :', err); });
        });
    }

    // Bouton « Installer » (Chrome/Edge/Android) — iOS passe par « Ajouter à l'écran d'accueil »
    (function () {
        var deferredPrompt = null;
        var btn = document.getElementById('pwa-install');
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            btn.hidden = false;
        });
        btn.addEventListener('click', function () {
            if (!deferredPrompt) return;
            btn.hidden = true;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function () { deferredPrompt = null; });
        });
        window.addEventListener('appinstalled', function () { btn.hidden = true; });
    })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
