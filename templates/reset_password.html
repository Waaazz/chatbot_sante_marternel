{% extends 'base.html' %}
{% block title %}Nouveau mot de passe{% endblock %}

{% block body %}
<div class="auth-page">
    {% include '_auth_aside.html' %}
    <main class="auth-main">
        <div class="auth-card">
            <a class="brand d-lg-none" href="/">{% include '_logo.html' %}</a>
            <h1>Nouveau mot de passe</h1>
            <p class="subtitle">Choisissez un nouveau mot de passe sécurisé.</p>

            {% include '_flashes.html' %}

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 8 caractères" autocomplete="new-password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe</label>
                    <div class="input-icon">
                        <i class="fas fa-shield-halved"></i>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Retapez le mot de passe" autocomplete="new-password" required>
                    </div>
                </div>
                <button type="submit" class="btn-brand btn-block-brand mt-2">
                    <i class="fas fa-key"></i>Réinitialiser le mot de passe
                </button>
            </form>
            <div class="page-links">
                <a href="/login"><i class="fas fa-arrow-left mr-1"></i> Retour à la connexion</a>
            </div>
        </div>
    </main>
</div>
{% endblock %}
